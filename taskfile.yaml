version: "3"

tasks:
  check:
    desc: Every gate CI runs. Cite its exit code as evidence.
    cmds:
      - task: spdx
      - task: tidy
      - task: lint
      - task: vuln
      - task: test
      - task: crd:check
      - task: chart:check
      - task: migrations

  spdx:
    desc: Every .go file opens with the SPDX license line.
    cmds:
      - hack/spdx.sh

  tidy:
    desc: Fail if go.mod or go.sum would change under go mod tidy.
    cmds:
      - go mod tidy -diff

  lint:
    desc: golangci-lint v2 (the mise pin, never a stale v1 on PATH) under go.mod's toolchain.
    cmds:
      - hack/lint.sh

  vuln:
    desc: Known vulnerabilities reachable from our code, the stdlib included.
    # go run builds govulncheck with the current Go: a binary built by an older Go
    # cannot load packages that need a newer one. Same version as mise.toml.
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  test:
    cmds:
      - go test -race -count=1 ./...
    env:
      # envtest's kube-apiserver and etcd, downloaded once per version into the user cache.
      KUBEBUILDER_ASSETS:
        sh: go tool setup-envtest use -p path 1.36.x

  migrations:
    desc: atlas.sum matches the migration directory, as the Atlas operator checks it. Offline.
    cmds:
      - atlas migrate validate --dir file://internal/store/migrations

  crd:gen:
    cmds:
      - go tool controller-gen object crd paths=./api/... output:crd:dir=./config/crd
      # controller-gen always writes //go:build first, and hack/spdx.sh wants the
      # license line there; Go allows line comments before the constraint.
      - |
        for f in api/v1alpha1/zz_generated.deepcopy.go api/factory/v1alpha1/zz_generated.deepcopy.go; do
          { printf '// SPDX-License-Identifier: Apache-2.0\n\n'; cat "$f"; } > "$f.tmp" && mv "$f.tmp" "$f"
        done
      # The factory chart ships the Task CRD: Tasks are runtime objects, never in Git.
      - cp config/crd/agents.ogenki.io_tasks.yaml charts/agent-factory/crds/

  crd:check:
    desc: The committed CRD is exactly what the types generate.
    cmds:
      - task: crd:gen
      - git diff --exit-code -- config/crd api charts

  chart:check:
    desc: Lint and render the factory chart.
    cmds:
      - helm lint --strict charts/agent-factory --set image.tag='v0.0.0@sha256:0000'
      - bash charts/agent-factory/tests/render.sh
