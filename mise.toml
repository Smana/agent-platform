# The same pins as Smana/cloud-native-ref, so both repos build with one toolchain.
[tools]
go = "1.27.2"
nodejs = "24.21.0"
"aqua:golangci/golangci-lint" = "2.14.0"
"aqua:go-task/task" = "3.53.1"
# The gate runs this version through `go run` (taskfile.yaml, vuln): bump both.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
"aqua:ariga/atlas" = "1.3.0"
# The factory chart: lint, render, package (task chart:check, the chart-prerelease job).
helm = "4.3.0"
# The chart test's structural assertions (charts/agent-factory/tests/render.sh).
"aqua:mikefarah/yq" = "4.54.1"
"aqua:kubernetes-sigs/kind" = "0.33.0"
