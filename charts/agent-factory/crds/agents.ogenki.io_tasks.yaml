---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tasks.agents.ogenki.io
spec:
  group: agents.ogenki.io
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.source.ref
      name: Source
      type: string
    - jsonPath: .spec.predictedClass
      name: Class
      type: string
    - jsonPath: .spec.template
      name: Template
      type: string
    - jsonPath: .status.pullRequest.url
      name: PR
      type: string
    - jsonPath: .status.usage.tokens
      name: Tokens
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Task is one unit of factory work (SP3 §4). The factory creates it at runtime and never
          commits it to Git. Its name derives from the idempotency key, so AlreadyExists is the dedup.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TaskSpec is what the task was asked to do, fixed at admission.
            properties:
              budget:
                description: Budget is the task's tier and caps, resolved at triage.
                properties:
                  model:
                    maxLength: 64
                    type: string
                  runMicroUSD:
                    description: |-
                      The USD caps in micro-dollars (OD-6 (b)): a run's, and the task's in place of TaskTokens
                      while every run of the task is priced. 0: the token caps.
                    format: int64
                    minimum: 0
                    type: integer
                  runMinutes:
                    format: int64
                    maximum: 480
                    type: integer
                  runTokens:
                    description: The per-run cap; SP1's XRD refuses more than the
                      gateway ceiling (C3).
                    format: int64
                    maximum: 5000000
                    type: integer
                  taskMicroUSD:
                    format: int64
                    minimum: 0
                    type: integer
                  taskTokens:
                    format: int64
                    type: integer
                  tier:
                    enum:
                    - light
                    - standard
                    - frontier
                    type: string
                type: object
              dataClass:
                description: Every run of the task gets it as spec.dataClass (C3,
                  OD-13).
                enum:
                - public
                - internal
                type: string
              findings:
                description: |-
                  The findings an oracle class's probe made this task of (merge gate classes MC6): what the
                  run is asked to fix, and what the gate's oracle checks the head no longer holds.
                items:
                  description: Finding is one dead external link two consecutive detector
                    runs on main reported (MC5).
                  properties:
                    archive:
                      description: |-
                        The Wayback Machine's closest snapshot of URL, an https://web.archive.org/web/ URL; empty
                        when it has none.
                      maxLength: 2048
                      pattern: ^https://web\.archive\.org/web/
                      type: string
                    file:
                      description: The Markdown file on main that holds the link.
                      maxLength: 512
                      minLength: 1
                      type: string
                    url:
                      description: The link target, an https URL.
                      maxLength: 2048
                      minLength: 1
                      pattern: ^https://
                      type: string
                  required:
                  - file
                  - url
                  type: object
                maxItems: 16
                type: array
              issue:
                description: The issue the factory narrates on; 0 for a task without
                  one (R28).
                minimum: 0
                type: integer
              issueAuthor:
                description: The issue's author on GitHub, for the room list's "mine"
                  filter.
                maxLength: 64
                type: string
              loop:
                description: |-
                  The loop policy its implementer runs get as spec.loop, resolved from loops.<class> at
                  triage so a config change never moves a task already triaged (loops design L2, L3). Unset:
                  the loop is off for the task's class.
                properties:
                  continuations:
                    format: int32
                    maximum: 5
                    minimum: 0
                    type: integer
                  judgeModel:
                    description: 'The judge''s alias; empty: no judge.'
                    enum:
                    - agent-default
                    - tier-light
                    - tier-standard
                    - tier-frontier
                    type: string
                  stallSteps:
                    format: int32
                    maximum: 500
                    minimum: 1
                    type: integer
                required:
                - continuations
                - stallSteps
                type: object
              maxMicroUSD:
                description: |-
                  The request's ceiling in micro-USD (F4, R5): triage caps the task and each run under it. Set
                  on api tasks only; 0 elsewhere.
                format: int64
                maximum: 1000000000
                minimum: 0
                type: integer
                x-kubernetes-validations:
                - message: maxMicroUSD never changes
                  rule: self == oldSelf
              parent:
                description: The parent this task is a part of (SL5), fixed at creation;
                  unset for any other task.
                properties:
                  index:
                    format: int32
                    maximum: 5
                    minimum: 1
                    type: integer
                  issue:
                    minimum: 1
                    type: integer
                  of:
                    format: int32
                    maximum: 5
                    minimum: 2
                    type: integer
                  task:
                    maxLength: 8
                    pattern: ^[a-z2-7]{8}$
                    type: string
                required:
                - index
                - issue
                - of
                - task
                type: object
                x-kubernetes-validations:
                - message: a part's index is at most its count
                  rule: self.index <= self.of
              predictedClass:
                description: 'Intent, not authority: it picks team and budget; only
                  policy-bot merges (§2).'
                maxLength: 64
                type: string
              repository:
                maxLength: 140
                pattern: ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$
                type: string
              scope:
                description: 'This child''s part of its parent''s task (SL5): one
                  scope of the approved split, fixed once set.'
                properties:
                  acceptance:
                    items:
                      description: TaskAcceptance is one acceptance check of a part.
                      properties:
                        check:
                          maxLength: 300
                          minLength: 1
                          type: string
                        proves:
                          maxLength: 200
                          minLength: 1
                          type: string
                      required:
                      - check
                      - proves
                      type: object
                    maxItems: 5
                    minItems: 1
                    type: array
                  assumptions:
                    items:
                      maxLength: 300
                      type: string
                    maxItems: 5
                    type: array
                  leave:
                    items:
                      maxLength: 200
                      type: string
                    maxItems: 10
                    type: array
                  plan:
                    items:
                      maxLength: 300
                      type: string
                    maxItems: 7
                    minItems: 1
                    type: array
                  state:
                    enum:
                    - ready
                    type: string
                  task:
                    maxLength: 1000
                    minLength: 1
                    type: string
                  touches:
                    items:
                      maxLength: 200
                      type: string
                    maxItems: 10
                    minItems: 1
                    type: array
                required:
                - acceptance
                - plan
                - state
                - task
                - touches
                type: object
              scopeMode:
                description: |-
                  The class's scope mode (scoper design SC2), fixed at triage so a config change never moves a
                  task already triaged. Empty: triaged before the scoper existed, which reads as off.
                enum:
                - "off"
                - steering
                - scoper
                type: string
              search:
                description: |-
                  Search offers its implementer runs the search tool (v3 feature 5, ST9), read from
                  loops.<class>.search at triage so a config change never moves a task already triaged; every
                  implementer claim of the task carries spec.loop.search.
                type: boolean
              source:
                description: |-
                  Source is where the task came from and how far its text is trusted. No rule holds the whole
                  source: the splitter's inherit() rewrites contentSHA256 of a re-labelled part, so only the
                  fields F4 adds, and the kind, are held (C1).
                properties:
                  contentSHA256:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  key:
                    maxLength: 512
                    type: string
                  kind:
                    enum:
                    - issue
                    - runlore
                    - schedule
                    - api
                    type: string
                  onBehalfOf:
                    description: 'The external user a link made the sponsor (R9):
                      slack:<team>/<user>.'
                    maxLength: 64
                    pattern: ^slack:T[A-Z0-9]{2,20}/[UW][A-Z0-9]{2,20}$
                    type: string
                  ref:
                    description: Smana/cloud-native-ref#2112, runlore:<alert>/<resource>,
                      or the schedule name.
                    maxLength: 512
                    type: string
                  requestedBy:
                    description: github:<login>, system:runlore or system:scheduler.
                    maxLength: 128
                    type: string
                  sponsor:
                    description: 'The maintainer accountable for an api task, as a
                      ledger key (F4, R8): github:<login>.'
                    maxLength: 46
                    pattern: ^github:[a-z0-9][a-z0-9-]{0,38}$
                    type: string
                  trust:
                    description: untrusted text is fenced as data for the harness
                      (T1).
                    enum:
                    - untrusted
                    - trusted
                    type: string
                required:
                - contentSHA256
                - key
                - kind
                - ref
                - requestedBy
                - trust
                type: object
                x-kubernetes-validations:
                - message: an api task names its sponsor
                  rule: self.kind != 'api' || (has(self.sponsor) && size(self.sponsor)
                    > 0)
                - message: only an api task has a sponsor
                  rule: self.kind == 'api' || (!has(self.sponsor) && !has(self.onBehalfOf))
                - message: a task's source kind never changes
                  rule: self.kind == oldSelf.kind
                - message: source.sponsor never changes
                  rule: has(self.sponsor) == has(oldSelf.sponsor) && (!has(self.sponsor)
                    || self.sponsor == oldSelf.sponsor)
                - message: source.onBehalfOf never changes
                  rule: has(self.onBehalfOf) == has(oldSelf.onBehalfOf) && (!has(self.onBehalfOf)
                    || self.onBehalfOf == oldSelf.onBehalfOf)
              split:
                description: |-
                  The split the scoper may offer (splitter design SL3), recorded at triage when the class's row
                  has one and C7's own tier is frontier; unset: no split offered.
                properties:
                  childTier:
                    enum:
                    - light
                    - standard
                    - frontier
                    type: string
                  familyMicroUSD:
                    description: 'The family''s cap in micro-dollars (SL10): the parent''s
                      and every child''s runs together.'
                    format: int64
                    minimum: 1
                    type: integer
                  maxChildren:
                    format: int32
                    maximum: 5
                    minimum: 2
                    type: integer
                required:
                - childTier
                - familyMicroUSD
                - maxChildren
                type: object
              steering:
                description: The class's steering note, read on the default branch
                  at triage (SC3); unset for none.
                properties:
                  path:
                    maxLength: 256
                    type: string
                  sha:
                    description: The note's git blob sha on the default branch.
                    maxLength: 40
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  text:
                    maxLength: 2048
                    type: string
                required:
                - path
                - sha
                - text
                type: object
              template:
                enum:
                - solo
                - pair
                - trio
                - investigate
                type: string
              text:
                description: The snapshot. Admission caps it at caps.maxTextBytes
                  (R6); this bound only protects etcd.
                maxLength: 65536
                type: string
            required:
            - dataClass
            - repository
            - source
            - text
            type: object
            x-kubernetes-validations:
            - message: spec.parent is fixed at creation
              rule: has(self.parent) == has(oldSelf.parent) && (!has(self.parent)
                || self.parent == oldSelf.parent)
            - message: spec.scope never changes once set
              rule: '!has(oldSelf.scope) || (has(self.scope) && self.scope == oldSelf.scope)'
            - message: an api task carries maxMicroUSD
              rule: self.source.kind != 'api' || (has(self.maxMicroUSD) && self.maxMicroUSD
                > 0)
          status:
            description: |-
              TaskStatus is the task's audit record: the whole §4 record, including the fields later
              phases fill.
            properties:
              checkReruns:
                description: |-
                  Re-runs of a cancelled required check, capped by merge.checkReruns. A cancelled check is
                  not a failure, so it never spends a fix run.
                format: int32
                type: integer
              checkRerunsHead:
                description: 'The head CheckReruns counts against: a new head resets
                  it.'
                maxLength: 64
                type: string
              classification:
                description: The C7 answer, recorded as-is (§2).
                properties:
                  classifier:
                    maxLength: 128
                    type: string
                  confidence:
                    description: '0.0–1.0, as a string: CRDs avoid floats.'
                    maxLength: 16
                    type: string
                  control:
                    description: 'OD-14: forced to tier-frontier whatever the classifier
                      said.'
                    type: boolean
                  fallback:
                    enum:
                    - none
                    - default
                    - static
                    type: string
                  fit:
                    description: 'Scored when the task ends (§7): under, over or fit.'
                    maxLength: 16
                    type: string
                  shadow:
                    items:
                      description: 'ShadowVerdict is a classifier consulted in shadow:
                        recorded, never acted on.'
                      properties:
                        classifier:
                          maxLength: 128
                          type: string
                        confidence:
                          maxLength: 16
                          type: string
                        tier:
                          maxLength: 16
                          type: string
                      required:
                      - classifier
                      - tier
                      type: object
                    maxItems: 16
                    type: array
                  tier:
                    enum:
                    - light
                    - standard
                    - frontier
                    type: string
                required:
                - classifier
                - fallback
                - tier
                type: object
              configHash:
                description: 'The config that triaged the task: the circuit breaker
                  resets with a new one (§6.4).'
                maxLength: 64
                type: string
              facts:
                description: 'The task facts last written to the room: their seq comes
                  from the roomSeq ledger (ruling SK).'
                properties:
                  hash:
                    maxLength: 16
                    type: string
                  posted:
                    type: boolean
                  seq:
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - hash
                - seq
                type: object
              fixRuns:
                format: int32
                type: integer
              gateReentries:
                description: |-
                  Returns from a transient AwaitingHuman hand-off to the merge gate (N1), every cause
                  counted; capped by the reconciler, so a flapping input cannot loop the gate.
                format: int32
                minimum: 0
                type: integer
              handled:
                description: GitHub review and comment ids already acted on (Δ5, commands).
                  The reconciler trims the oldest.
                items:
                  format: int64
                  type: integer
                maxItems: 512
                type: array
                x-kubernetes-list-type: set
              lastActivity:
                description: The last room event seen for the running run (stuck detection,
                  §6.3).
                format: date-time
                type: string
              narrated:
                description: |-
                  Idempotency keys of the comments already posted (R22), and of the room messages
                  (room/<seq>/<key>). narrate trims the oldest: a display list, not a ledger (ruling SK).
                items:
                  maxLength: 512
                  type: string
                maxItems: 512
                type: array
                x-kubernetes-list-type: set
              nextRole:
                description: |-
                  The verifier the task went back to Queued for (§3): the next reviewer or tester run starts
                  there, behind the caps and the human-driver rule (C4). Cleared once that run exists.
                enum:
                - reviewer
                - tester
                type: string
              nextTrigger:
                description: |-
                  The trigger of the next implementer run, set when the task goes back to Queued (Δ5) and
                  cleared once that run exists.
                enum:
                - initial
                - review
                - human
                - ci
                - retry
                - resume
                type: string
              outbox:
                description: |-
                  Comments the task owes its issue or PR (ruling SO): written with the transition that caused
                  them, removed once posted. A task with any left is reconciled even after it ends.
                items:
                  description: |-
                    Narration is one pending comment. Its key is the comment's idempotency key: in status.narrated
                    once posted, and in the comment's marker, which a retry finds when a post landed but failed.
                  properties:
                    body:
                      description: The factory's own words, never text a user wrote.
                      maxLength: 4096
                      type: string
                    key:
                      maxLength: 128
                      type: string
                    number:
                      description: The issue or PR it goes to.
                      minimum: 1
                      type: integer
                  required:
                  - body
                  - key
                  - number
                  type: object
                maxItems: 16
                type: array
              phase:
                enum:
                - Received
                - Rejected
                - Triaged
                - Queued
                - Implementing
                - NoOp
                - Reviewing
                - AwaitingCI
                - AutoMerging
                - AwaitingHuman
                - Merged
                - Verifying
                - Done
                - Reverted
                - Escalated
                - Closed
                - Stopped
                - Split
                type: string
              phaseSince:
                format: date-time
                type: string
              pullRequest:
                description: PullRequestRef is the task's pull request and what happened
                  to it.
                properties:
                  armedAt:
                    format: date-time
                    type: string
                  author:
                    maxLength: 64
                    type: string
                  autoMerged:
                    type: boolean
                  headSHA:
                    description: |-
                      The head when the pull request was found, then the head the merge gate last acted on: merged,
                      or handed to a human (N1: a push after the hand-off keeps it with the human).
                    maxLength: 64
                    type: string
                  mergeCommitSHA:
                    maxLength: 64
                    type: string
                  mergedAt:
                    format: date-time
                    type: string
                  mergedBy:
                    maxLength: 64
                    type: string
                  nodeID:
                    maxLength: 128
                    type: string
                  number:
                    type: integer
                  revertNumber:
                    type: integer
                  reviewers:
                    description: Everyone who has submitted a review, oldest first.
                    items:
                      maxLength: 64
                      type: string
                    maxItems: 16
                    type: array
                  url:
                    maxLength: 2048
                    type: string
                required:
                - number
                - url
                type: object
              reason:
                maxLength: 1024
                type: string
              resumes:
                description: |-
                  Automatic resumes of runs lost to their infrastructure (disruption design §4), every role
                  counted; capped by the config's resume.maxPerTask.
                format: int32
                minimum: 0
                type: integer
              retriedBy:
                description: |-
                  RetriedBy is the maintainer whose /factory retry sent the task back, github:<login>: the
                  person its later runs are charged to (v2 per-person caps D2). Empty: the labeller.
                maxLength: 64
                type: string
              retries:
                format: int32
                type: integer
              reviewRounds:
                format: int32
                type: integer
              roomRef:
                maxLength: 253
                type: string
              roomSeq:
                description: |-
                  The last clientSeq the task took for a task_state message or its facts in its room (ruling
                  SK). The broker keeps one message per clientSeq, so the ledger is its own field, never trimmed
                  like narrated, and only rises: the next message is roomSeq + 1, persisted before it is posted.
                format: int64
                minimum: 0
                type: integer
                x-kubernetes-validations:
                - message: 'roomSeq never goes down: the broker would drop a reused
                    clientSeq'
                  rule: self >= oldSelf
              runs:
                items:
                  description: RunRecord is one AgentRun the task started.
                  properties:
                    chargedTo:
                      description: |-
                        The person the run was charged to beside the fleet (v2 per-person caps D2), github:<login>;
                        empty when per-person caps were off or no person caused it.
                      maxLength: 64
                      type: string
                    costMicroUSD:
                      description: The run's cost in micro-dollars, cache reads at
                        their own rate, as the meter priced it.
                      format: int64
                      type: integer
                    finished:
                      format: date-time
                      type: string
                    headSHA:
                      description: |-
                        The pull request's head a reviewer or tester run was given: its approve counts for that
                        commit only, and only while the head has not moved.
                      maxLength: 64
                      type: string
                    id:
                      maxLength: 8
                      pattern: ^[a-z2-7]{8}$
                      type: string
                    phase:
                      maxLength: 64
                      type: string
                    provenance:
                      description: What the run ran on (R10), each field filled once
                        as it becomes known.
                      properties:
                        compositionRevision:
                          description: The CompositionRevision Crossplane bound the
                            claim to, as first read.
                          maxLength: 253
                          type: string
                        factoryVersion:
                          description: The factory build that created the claim (version.Version),
                            from its CREATE-only annotation.
                          maxLength: 64
                          type: string
                        harnessImage:
                          description: |-
                            The harness container's imageID, <repository>@sha256:<digest>, as the composition read it
                            from the run's pod.
                          maxLength: 320
                          type: string
                        servedModels:
                          description: The models that served the run, as the meter
                            read gen_ai_request_model; sorted.
                          items:
                            maxLength: 64
                            type: string
                          maxItems: 8
                          type: array
                      type: object
                    reason:
                      description: The room's end reason (SP2 P15), else the AgentRun's.
                      maxLength: 1024
                      type: string
                    role:
                      enum:
                      - implementer
                      - reviewer
                      - tester
                      - triager
                      type: string
                    round:
                      format: int32
                      type: integer
                    startSeq:
                      description: 'The room''s lastSeq when the run was created:
                        verdicts are read after it.'
                      format: int64
                      type: integer
                    started:
                      format: date-time
                      type: string
                    tokens:
                      format: int64
                      type: integer
                    trigger:
                      description: Why the run exists.
                      enum:
                      - initial
                      - review
                      - human
                      - ci
                      - retry
                      - resume
                      type: string
                    unpriced:
                      description: 'Why the meter could not price the run: its task
                        is then held to TaskTokens.'
                      enum:
                      - unpriced
                      - untyped
                      type: string
                    verdict:
                      maxLength: 32
                      type: string
                  required:
                  - id
                  - role
                  - trigger
                  type: object
                maxItems: 256
                type: array
              scope:
                description: |-
                  The scoper's outcome (scoper design SC12), set once when its run ends and kept when the task
                  later stops: ready, question, assumed, missing or failed, and the seq of the handoff that
                  carries the scope (0 for none). Unset: no scoper ran, or it has not ended.
                properties:
                  seq:
                    format: int64
                    minimum: 0
                    type: integer
                  state:
                    enum:
                    - ready
                    - question
                    - assumed
                    - missing
                    - failed
                    type: string
                required:
                - state
                type: object
              split:
                description: 'The split''s record on its parent (splitter design SL14):
                  set when the scoper hands one off.'
                properties:
                  approvedBy:
                    description: 'The maintainer whose /factory split approved it,
                      github:<login>: every child''s payer (SL11).'
                    maxLength: 64
                    type: string
                  children:
                    description: The parts opened so far, in order, each with its
                      newest generation's task.
                    items:
                      description: SplitChild is one opened part.
                      properties:
                        index:
                          format: int32
                          maximum: 5
                          minimum: 1
                          type: integer
                        issue:
                          minimum: 1
                          type: integer
                        outcome:
                          enum:
                          - landed
                          - dropped
                          - reverted
                          type: string
                        task:
                          maxLength: 8
                          pattern: ^[a-z2-7]{8}$
                          type: string
                      required:
                      - index
                      - issue
                      - task
                      type: object
                    maxItems: 5
                    type: array
                  of:
                    description: How many parts the proposed split holds; 0 for an
                      ignored one.
                    format: int32
                    maximum: 5
                    minimum: 0
                    type: integer
                  seq:
                    description: The room seq of the handoff that carries the split.
                    format: int64
                    minimum: 1
                    type: integer
                  state:
                    enum:
                    - proposed
                    - approved
                    - declined
                    - superseded
                    - expired
                    - ignored
                    type: string
                required:
                - seq
                - state
                type: object
              trace:
                description: 'The task''s root span (R46): minted at acceptance, exported
                  once when the task ends.'
                properties:
                  exportAbandoned:
                    description: 'The collector refused the span for a day after the
                      task ended: given up, never retried (ST2).'
                    type: boolean
                  exported:
                    type: boolean
                  spanID:
                    maxLength: 16
                    pattern: ^[0-9a-f]{16}$
                    type: string
                    x-kubernetes-validations:
                    - message: an all-zero span id is invalid W3C
                      rule: self != '0000000000000000'
                  traceID:
                    maxLength: 32
                    pattern: ^[0-9a-f]{32}$
