---
# Tasks, their rooms, the stop object, the day ledgers (R50), leader election (§6.5).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-factory
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
rules:
  - apiGroups: [agents.ogenki.io]
    resources: [tasks]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [agents.ogenki.io]
    resources: [tasks/status]
    verbs: [get, update, patch]
  - apiGroups: [agents.ogenki.io]
    resources: [rooms]
    verbs: [get, list, watch, create, delete]
  # ConfigMaps: the stop object, R50's day ledgers (names carry the date, so resourceNames cannot
  # bound them) and nothing else. The Role's namespace is the bound: the factory can read and
  # write every ConfigMap in it, its own config included, so the namespace holds no ConfigMap it
  # must not touch. watch is for the stop object's cache.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-factory
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-factory}
subjects:
  - {kind: ServiceAccount, name: agent-factory, namespace: {{ .Release.Namespace }}}
---
# AgentRuns: the factory creates them, meters them (annotations only, Kyverno-limited from
# phase 5), and deletes them. Never Secrets, never another namespace's objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-factory
  namespace: agents
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
rules:
  - apiGroups: [cloud.ogenki.io]
    resources: [agentruns]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-factory
  namespace: agents
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-factory}
subjects:
  - {kind: ServiceAccount, name: agent-factory, namespace: {{ .Release.Namespace }}}
