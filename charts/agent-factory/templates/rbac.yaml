---
# Tasks, their rooms, the stop object, the day ledgers (R50), leader election (§6.5).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-factory
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
rules:
  - apiGroups: [agents.ogenki.io]
    resources: [tasks]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [agents.ogenki.io]
    resources: [tasks/status]
    verbs: [get, update, patch]
  - apiGroups: [agents.ogenki.io]
    resources: [rooms]
    verbs: [get, list, watch, create]
  # The stop object: the cache lists and watches it by a metadata.name field selector.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [agent-factory-stop]
    verbs: [get, list, watch]
  # R50's day ledgers (agent-factory-ledger-<UTC day>): the API reserves a slot through them,
  # the meter settles spend and prunes old days. Names carry the date, so resourceNames cannot
  # bound them; the Role's namespace is the bound. The reads are live: the cached watch above
  # carries a name selector and can never see a ledger (5.2/5.3's caveat, resolved here).
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-factory
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-factory}
subjects:
  - {kind: ServiceAccount, name: agent-factory, namespace: {{ .Release.Namespace }}}
---
# AgentRuns: the factory creates them, meters them (annotations only, Kyverno-limited from
# phase 5), and deletes them. Never Secrets, never another namespace's objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-factory
  namespace: agents
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
rules:
  - apiGroups: [cloud.ogenki.io]
    resources: [agentruns]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-factory
  namespace: agents
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-factory}
subjects:
  - {kind: ServiceAccount, name: agent-factory, namespace: {{ .Release.Namespace }}}
