apiVersion: v1
kind: Service
metadata:
  name: agent-factory
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: agent-factory}
  ports:
    - {name: metrics, port: 9090, targetPort: ops, protocol: TCP}
    - {name: api, port: 8443, targetPort: api, protocol: TCP}
