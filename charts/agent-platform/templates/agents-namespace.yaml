{{- if .Values.createRunsNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.runs.namespace }}
  annotations:
    # Uninstall must not delete the runs and the Secrets in them.
    helm.sh/resource-policy: keep
---
{{ end -}}
# An empty rule selects no peer: enforcement on in both directions, nothing allowed. Each run's own
# CiliumNetworkPolicy adds its allowances.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.runs.namespace }}
spec:
  endpointSelector: {}
  ingress: [{}]
  egress: [{}]
