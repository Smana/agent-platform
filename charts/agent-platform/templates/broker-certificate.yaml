{{- if .Values.broker.tls.issuerRef.name }}
# :8443 serves TLS; the broker re-reads the pair when cert-manager renews it, so no restart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: room-broker-tls
  labels: {{- include "ap.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.broker.tls.secretName }}
  duration: 720h # 30d
  renewBefore: 240h # 10d
  commonName: room-broker.{{ .Release.Namespace }}.svc.cluster.local
  dnsNames:
    - room-broker.{{ .Release.Namespace }}.svc
    - room-broker.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    {{- toYaml .Values.broker.tls.issuerRef | nindent 4 }}
{{- end }}
