---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agentruns.agents.ogenki.io
spec:
  group: agents.ogenki.io
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    singular: agentrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.roomRef
      name: Room
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentRun is one agent run, for the run-controller (adoption 3a). Its spec is SP1's XRD's
          (crossplane-configuration apis/agentrun/definition.yaml), so a run manifest suits both
          runtimes. The name prefix is the controller's config, so only the id shape is checked here.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentRunSpec is what the run does, on which repository, for
              whom.
            properties:
              baseRef:
                default: main
                maxLength: 255
                pattern: ^[A-Za-z0-9]+(?:(?:[_/-]+(?:\.[_/-]*)?|\.[_/-]*)[A-Za-z0-9]+)*$
                type: string
                x-kubernetes-validations:
                - message: baseRef is immutable
                  rule: self == oldSelf
              branch:
                pattern: ^agent/[a-z0-9][a-z0-9._/-]{0,100}$
                type: string
              budget:
                default: {}
                description: AgentRunBudget bounds the run. Without a gateway, only
                  maxMinutes is enforced.
                properties:
                  maxMinutes:
                    default: 120
                    format: int64
                    maximum: 480
                    minimum: 1
                    type: integer
                    x-kubernetes-validations:
                    - message: budget.maxMinutes is immutable
                      rule: self == oldSelf
                  maxTokens:
                    default: 2000000
                    format: int64
                    maximum: 5000000
                    minimum: 1
                    type: integer
                type: object
              dataClass:
                enum:
                - public
                - internal
                type: string
                x-kubernetes-validations:
                - message: dataClass is immutable
                  rule: self == oldSelf
              egress:
                default: {}
                description: AgentRunEgress adds package registries to the always-on
                  github profile.
                properties:
                  profiles:
                    default: []
                    items:
                      description: AgentRunEgressProfile is one registry profile;
                        github is not one, it is always on.
                      enum:
                      - pypi
                      - npm
                      - golang
                      - crates
                      type: string
                    maxItems: 4
                    type: array
                    x-kubernetes-list-type: set
                type: object
                x-kubernetes-validations:
                - message: egress is immutable
                  rule: self == oldSelf
              harness:
                default: openhands
                enum:
                - openhands
                type: string
                x-kubernetes-validations:
                - message: harness is immutable
                  rule: self == oldSelf
              loop:
                description: 'AgentRunLoop is the run''s loop policy, fixed at creation
                  (v3: the loop policy''s claim object).'
                properties:
                  checks:
                    description: |-
                      Checks runs the repository's checks in the sandbox (v3 feature 3): the harness gets
                      AGENT_CHECKS=1 and the pod's deadline as AGENT_RUN_SECONDS. A public run only.
                    type: boolean
                  search:
                    description: |-
                      Search offers the search tool (v3 feature 5) to an implementer only: the harness and the room
                      bridge both get AGENT_SEARCH=1, the bridge so it classes the harness's own search as plain.
                    type: boolean
                type: object
              model:
                default: agent-default
                description: |-
                  A gateway alias on cloud-native-ref: a C5 tier name, or a provider alias (v3 F15), which the
                  gateway serves public runs only; the run-controller ignores it (3a R7).
                enum:
                - agent-default
                - tier-light
                - tier-standard
                - tier-frontier
                - kimi-frontier
                - mistral-standard
                - mistral-light
                type: string
                x-kubernetes-validations:
                - message: model is immutable
                  rule: self == oldSelf
              principal:
                maxLength: 128
                pattern: ^(human:[A-Za-z0-9@._-]+|system:[a-z0-9-]+)$
                type: string
                x-kubernetes-validations:
                - message: principal is immutable
                  rule: self == oldSelf
              queueName:
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              repository:
                maxLength: 140
                pattern: ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$
                type: string
                x-kubernetes-validations:
                - message: repository is immutable
                  rule: self == oldSelf
              role:
                enum:
                - implementer
                - reviewer
                - tester
                - triager
                type: string
                x-kubernetes-validations:
                - message: role is immutable
                  rule: self == oldSelf
              roomRef:
                pattern: ^[a-z2-7]{8}$
                type: string
              size:
                default: small
                enum:
                - small
                - medium
                - large
                type: string
                x-kubernetes-validations:
                - message: size is immutable
                  rule: self == oldSelf
              suspendable:
                type: boolean
              task:
                description: AgentRunTask is exactly one of text or url.
                properties:
                  text:
                    maxLength: 16384
                    type: string
                  url:
                    maxLength: 256
                    pattern: ^https://github\.com/[A-Za-z0-9-]+/[A-Za-z0-9._-]+/(issues|pull)/[0-9]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: set exactly one of task.text or task.url
                  rule: '(has(self.text) ? 1 : 0) + (has(self.url) ? 1 : 0) == 1'
                - message: task is immutable
                  rule: self == oldSelf
            required:
            - dataClass
            - principal
            - repository
            - role
            - task
            type: object
            x-kubernetes-validations:
            - message: a reviewer run needs a pull request URL as its task
              rule: self.role != 'reviewer' || (has(self.task.url) && self.task.url.matches('^https://github\\.com/[^/]+/[^/]+/pull/[0-9]+$'))
            - message: task.url must point into spec.repository
              rule: '!has(self.task.url) || self.task.url.startsWith(''https://github.com/''
                + self.repository + ''/'')'
            - message: an internal run takes no egress profiles
              rule: self.dataClass != 'internal' || !has(self.egress) || !has(self.egress.profiles)
                || size(self.egress.profiles) == 0
            - message: branch is immutable and cannot be added or removed after creation
              rule: has(self.branch) == has(oldSelf.branch) && (!has(self.branch)
                || self.branch == oldSelf.branch)
            - message: roomRef is immutable and cannot be added or removed after creation
              rule: has(self.roomRef) == has(oldSelf.roomRef) && (!has(self.roomRef)
                || self.roomRef == oldSelf.roomRef)
            - message: queueName is immutable and cannot be added or removed after
                creation
              rule: has(self.queueName) == has(oldSelf.queueName) && (!has(self.queueName)
                || self.queueName == oldSelf.queueName)
            - message: suspendable is immutable and cannot be added or removed after
                creation
              rule: has(self.suspendable) == has(oldSelf.suspendable) && (!has(self.suspendable)
                || self.suspendable == oldSelf.suspendable)
            - message: an internal run runs no repository checks
              rule: self.dataClass != 'internal' || !has(self.loop) || !has(self.loop.checks)
                || !self.loop.checks
            - message: loop is immutable and cannot be added or removed after creation
              rule: has(self.loop) == has(oldSelf.loop) && (!has(self.loop) || (has(self.loop.checks)
                == has(oldSelf.loop.checks) && (!has(self.loop.checks) || self.loop.checks
                == oldSelf.loop.checks) && has(self.loop.search) == has(oldSelf.loop.search)
                && (!has(self.loop.search) || self.loop.search == oldSelf.loop.search)))
          status:
            description: AgentRunStatus is what runwatch and the factory read (C3),
              as the composition writes it.
            properties:
              branch:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              conversationId:
                type: string
              finishedAt:
                type: string
              phase:
                enum:
                - Pending
                - Running
                - Suspended
                - Succeeded
                - Failed
                - BudgetExhausted
                - Revoked
                type: string
              pullRequest:
                type: string
              reason:
                type: string
              runId:
                type: string
              startedAt:
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: an AgentRun is named <prefix><runId>, runId being 8 characters
            of [a-z2-7]
          rule: self.metadata.name.matches('^[a-z0-9][a-z0-9-]*-[a-z2-7]{8}$')
    served: true
    storage: true
    subresources:
      status: {}
