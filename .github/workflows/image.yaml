name: image
# One signed multi-arch image: each platform built on its own native runner and pushed by digest,
# then the two joined under the tag and the index signed. No QEMU: the harness's arm64 half took
# 22-28 min emulated and set the length of every release and PR prerelease. Called by release.yaml
# (the tag) and ci.yaml's prerelease (v<next-patch>-pr<N>.<sha8>).
on:
  workflow_call:
    inputs:
      image:
        description: The image's name under ghcr.io/smana, and its directory under images/
        required: true
        type: string
      version:
        description: The tag, and the VERSION build arg
        required: true
        type: string
    outputs:
      digest:
        description: The signed index's digest
        value: ${{ jobs.merge.outputs.digest }}
permissions: {}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # The sandbox pool mixes c/m gen 6+ families, Graviton included.
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # The Go images build from the module root; the harness from its own directory.
          context: ${{ inputs.image == 'maku-harness' && 'images/maku-harness' || '.' }}
          file: images/${{ inputs.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ inputs.version }}
          provenance: mode=max
          sbom: true
          # By digest only: the tag goes on the joined index, never on one platform's image.
          outputs: type=image,name=ghcr.io/smana/${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for the merge
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/${PLATFORM//\//-}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ inputs.image }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    outputs:
      digest: ${{ steps.join.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ inputs.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each platform's digest is an index of its image and its attestations (provenance, SBOM):
      # the join keeps both platforms' attestations beside their images.
      - id: join
        name: Join the platforms under the tag
        env:
          IMAGE: ghcr.io/smana/${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sources=()
          for f in "$RUNNER_TEMP"/digests/*; do sources+=("${IMAGE}@$(cat "$f")"); done
          [ "${#sources[@]}" = 2 ] || { echo "want 2 platform digests, got ${#sources[@]}" >&2; exit 1; }
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{ json .Manifest }}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no index digest for ${IMAGE}:${VERSION}" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Signs the digest, never the tag, so a re-pushed tag cannot inherit the signature.
      - env:
          REF: ghcr.io/smana/${{ inputs.image }}@${{ steps.join.outputs.digest }}
        run: cosign sign --yes "$REF"
      - env:
          IMAGE: ghcr.io/smana/${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.join.outputs.digest }}
          NAME: ${{ inputs.image }}
        run: |
          echo "### ${NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}:${VERSION}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
