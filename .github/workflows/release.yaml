name: release
on:
  push:
    tags: ["v*"]
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The arm64 half builds under QEMU: v0.6.0's took ~29 min, and the 30-min limit cancelled the
    # job after its push and signature, so roomctl and the release never ran.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      matrix:
        image: [room-broker, room-bridge, agent-factory]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # No cache on the release path: a PR-written cache must not reach a published image.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
      # A tag can point at a commit that never passed CI.
      - run: task check
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/smana/${{ matrix.image }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - env:
          REF: ghcr.io/smana/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

  # The factory chart at the tag's version, its appVersion the image of the same tag.
  chart-release:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
          install_args: helm
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # cosign reads Docker's credentials, not helm's registry config: without this the signature
      # upload is refused after the chart is pushed.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package, push and sign
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          helm package charts/agent-factory --version "$v" --app-version "$GITHUB_REF_NAME"
          out="$(helm push "agent-factory-${v}.tgz" oci://ghcr.io/smana/charts 2>&1)"; echo "$out"
          digest="$(sed -n 's/^Digest: //p' <<<"$out")"
          [ -n "$digest" ] || { echo "helm push printed no digest" >&2; exit 1; }
          cosign sign --yes "ghcr.io/smana/charts/agent-factory@${digest}"

  # roomctl's binaries and their checksums, on the tag's GitHub release (P33), and the Room CRD:
  # cloud-native-ref vendors it from the release asset, not from a branch (ruling P16).
  roomctl:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release and its assets
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/Smana/agent-platform/internal/version.Version=${VERSION}" \
              -o "roomctl-${os}-${arch}" ./cmd/roomctl
          done
          sha256sum roomctl-* > roomctl.sha256
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          cp config/crd/agents.ogenki.io_rooms.yaml crd-rooms.yaml
          gh release upload "$TAG" roomctl-* roomctl.sha256 crd-rooms.yaml --clobber
