# The whole quickstart in CI: this checkout's images in kind, a stub model, one AgentRun to Succeeded.
# Needs the owner's secrets QUICKSTART_REPO (a throwaway owner/name) and QUICKSTART_GITHUB_TOKEN (a
# fine-grained PAT scoped to it: Contents read/write). The repo needs a `main` branch with at least
# one commit: the harness branches from it. Without them (a fork PR) every step is skipped, not failed.
name: quickstart-e2e
on:
  pull_request:
    paths:
      - charts/**
      - hack/quickstart/**
      - cmd/**
      - internal/**
      - api/**
      - images/**
      - go.mod
      - go.sum
      - mise.toml
      - .github/workflows/quickstart-e2e.yaml
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: quickstart-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      QUICKSTART_REPO: ${{ secrets.QUICKSTART_REPO }}
    steps:
      - if: env.QUICKSTART_REPO == ''
        run: echo "QUICKSTART_REPO secret absent, fork PR - skipping the e2e"
      - if: env.QUICKSTART_REPO != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - if: env.QUICKSTART_REPO != ''
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: aqua:kubernetes-sigs/kind helm aqua:mikefarah/yq # all e2e needs; docker and kubectl ship with the runner
      - if: env.QUICKSTART_REPO != ''
        # ~14 GB free is less than the harness image takes once built, saved and loaded into kind.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - if: env.QUICKSTART_REPO != ''
        run: hack/quickstart/e2e.sh
        env:
          GITHUB_TOKEN: ${{ secrets.QUICKSTART_GITHUB_TOKEN }}
          REPO: ${{ secrets.QUICKSTART_REPO }}
