# The whole quickstart in CI: this checkout's images and maku in kind, a stub model, one run to Succeeded through maku run.
# Needs the owner's secrets QUICKSTART_REPO (a throwaway owner/name) and QUICKSTART_GITHUB_TOKEN (a
# fine-grained PAT scoped to it: Contents read; the stub model never pushes). The repo needs a `main` branch with at least
# one commit: the harness branches from it. Without them (a fork PR) every step is skipped, not failed.
name: quickstart-e2e
on:
  pull_request:
    paths:
      - charts/**
      - hack/quickstart/**
      - cmd/**
      - internal/**
      - api/**
      - images/**
      - go.mod
      - go.sum
      - mise.toml
      - .github/workflows/quickstart-e2e.yaml
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: quickstart-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      QUICKSTART_REPO: ${{ secrets.QUICKSTART_REPO }}
    steps:
      - if: env.QUICKSTART_REPO == ''
        run: |
          echo "::warning title=quickstart-e2e skipped::QUICKSTART_REPO is absent: nothing ran, so this green check proves nothing about the quickstart."
          {
            echo "### quickstart-e2e skipped: nothing ran"
            echo
            echo "A green check here is **not** a pass. Add these Actions secrets (a fork PR never receives them):"
            echo "- \`QUICKSTART_REPO\`: a throwaway \`owner/name\` with a \`main\` branch and one commit"
            echo "- \`QUICKSTART_GITHUB_TOKEN\`: a fine-grained PAT, Contents read on that repository"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: env.QUICKSTART_REPO != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - if: env.QUICKSTART_REPO != ''
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: go kubectl aqua:kubernetes-sigs/kind helm aqua:mikefarah/yq # go builds maku; kubectl is the mise.toml pin, within the kind node's skew
      - if: env.QUICKSTART_REPO != ''
        # ~14 GB free is less than the harness image takes once built, saved and loaded into kind.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - if: env.QUICKSTART_REPO != ''
        run: hack/quickstart/e2e.sh
        env:
          GITHUB_TOKEN: ${{ secrets.QUICKSTART_GITHUB_TOKEN }}
          REPO: ${{ secrets.QUICKSTART_REPO }}
  # The CRD group move (agents.ogenki.io -> maku.ogenki.io): v0.30.0, the upgrade, maku-broker migrate-group.
  # No secrets: nothing here starts a run, so it also runs on fork PRs.
  migrate-group:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the v0.30.0 tag, for its chart and CRDs
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: go kubectl aqua:kubernetes-sigs/kind helm aqua:mikefarah/yq
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: hack/quickstart/migrate-e2e.sh
