# Read by the SQLInstance composition's Flux Kustomization: the ConfigMap name
# `atlas-db-migrations` is the composition's contract (cloud-native-ref apps/AGENTS.md).
# Every migration file of every phase is listed here, with atlas.sum.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: atlas-db-migrations
    files:
      - ./20260927120000_rooms.sql
      - ./20260929120000_verdicts.sql
      - ./20261001120000_driver_queue.sql
      - ./20261001130000_delivery_indexes.sql
      - ./20261001140000_brief_index.sql
      - ./20261005120000_approvals.sql
      - ./20261005130000_approval_indexes.sql
      - ./20261008120000_task_facts_index.sql
      - atlas.sum
    options:
      disableNameSuffixHash: true
