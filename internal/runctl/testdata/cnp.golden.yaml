apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    agents.ogenki.io/role: implementer
    agents.ogenki.io/run-id: abcdefgh
    app.kubernetes.io/managed-by: run-controller
  name: run-abcdefgh
  namespace: agents
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        - matchName: raw.githubusercontent.com
        - matchName: proxy.golang.org
        - matchName: sum.golang.org
        - matchName: api.anthropic.com
        - matchName: room-broker.agent-platform.svc.cluster.local
  - toFQDNs:
    - matchName: github.com
    - matchName: api.github.com
    - matchName: codeload.github.com
    - matchName: objects.githubusercontent.com
    - matchName: raw.githubusercontent.com
    - matchName: proxy.golang.org
    - matchName: sum.golang.org
    - matchName: api.anthropic.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: room-broker
        io.kubernetes.pod.namespace: agent-platform
    toPorts:
    - ports:
      - port: "8443"
        protocol: TCP
  endpointSelector:
    matchLabels:
      agents.ogenki.io/run-id: abcdefgh
  ingress:
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: "8085"
        protocol: TCP
